strictDepBuilds: false
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: set this to true or false
# Окно созревания (pnpm 11 включает его по умолчанию) отказывает в установке версии, опубликованной
# только что. Строку ниже вписал САМ pnpm при установке `@trdlabs/sdk@0.15.0` через минуты после её
# публикации — это не ручное послабление политики, но и оставлять её необъяснённой нельзя: запись в
# supply-chain-настройке, происхождение которой никто не помнит, читается как чья-то осознанная
# уступка.
#
# Что это значит по существу: исключение ТОЧЕЧНОЕ — конкретный пакет конкретной версии, наш
# собственный, выпущенный этой же цепочкой и проверенный независимо из реестра (версия, точный пин
# контракта, провенанс). Все остальные ~N записей лок-файла выдержку проходят как обычно.
#
# Смежная находка бэктестера (его `pnpm-workspace.yaml`): в pnpm 11.6.0 `minimumReleaseAgeExclude`
# ИГНОРИРУЕТСЯ путём проверки лок-файла (`pnpm install --frozen-lockfile`), поэтому там окно
# пришлось выключить целиком. Здесь CI на этом же коммите зелёный, то есть на нашем сочетании
# версий путь проверки исключение уважает — но полагаться на это как на правило не следует.
#
# 2026-08-13, `0.18.0`: предупреждение выше ПОДТВЕРДИЛОСЬ, и не только локально — CI на этом самом
# коммите упал тремя job'ами из четырёх на `pnpm install --frozen-lockfile` с
# `ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION`, хотя точечное исключение стояло. Значит утверждение «на
# нашем сочетании версий путь проверки исключение уважает» было верно для 0.15.0 по случайности
# (к моменту прогона версия успела созреть), а не по устройству. Список ниже остаётся ДЕКЛАРАЦИЕЙ
# НАМЕРЕНИЯ; работает только само окно.
#
# ОКНО ВЫКЛЮЧЕНО — перенос решения владельца, принятого для бэктестера 2026-07-28 и подтверждённого
# 2026-07-29, в репозиторий, где оно теперь и бьёт. Там оно записано дословно так: пока движок
# выпускается часто, окно в сутки означает сутки простоя после каждой публикации — пин нельзя
# поднять, а значит нельзя смержить и работу, которая на него опирается. Сегодня цепочка
# sdk → engine → backtester упирается ровно в это.
#
# ЧТО ЭТО СТОИТ. Выдержки лишены ВСЕ ~129 записей лок-файла, а не только наши. Это тот самый класс
# атак, ради которого pnpm 11 включил окно по умолчанию: угнанный аккаунт мейнтейнера, вредоносная
# версия, снятая с реестра через несколько часов. Компенсирующая мера, действующая и сейчас, —
# лок-файл: без осознанного `pnpm install` и ревью диффа `pnpm-lock.yaml` новая версия стороннего
# пакета в сборку не попадёт.
#
# КОГДА ВЕРНУТЬ. Как только выпуски `@trdlabs/sdk` и `@trdlabs/engine` станут редкими — или как
# только pnpm починит `minimumReleaseAgeExclude` в проверке лок-файла: тогда окно держится
# постоянно, свои пакеты проходят точечно, и выбирать между защитой и скоростью не приходится.
minimumReleaseAge: 0

minimumReleaseAgeExclude:
  - '@trdlabs/sdk@0.15.0'
  - '@trdlabs/sdk@0.18.0'
