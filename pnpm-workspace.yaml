strictDepBuilds: false
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: set this to true or false
# Окно созревания (pnpm 11 включает его по умолчанию) отказывает в установке версии, опубликованной
# только что. Строку ниже вписал САМ pnpm при установке `@trdlabs/sdk@0.15.0` через минуты после её
# публикации — это не ручное послабление политики, но и оставлять её необъяснённой нельзя: запись в
# supply-chain-настройке, происхождение которой никто не помнит, читается как чья-то осознанная
# уступка.
#
# Что это значит по существу: исключение ТОЧЕЧНОЕ — конкретный пакет конкретной версии, наш
# собственный, выпущенный этой же цепочкой и проверенный независимо из реестра (версия, точный пин
# контракта, провенанс). Все остальные ~N записей лок-файла выдержку проходят как обычно.
#
# Смежная находка бэктестера (его `pnpm-workspace.yaml`): в pnpm 11.6.0 `minimumReleaseAgeExclude`
# ИГНОРИРУЕТСЯ путём проверки лок-файла (`pnpm install --frozen-lockfile`), поэтому там окно
# пришлось выключить целиком. Здесь CI на этом же коммите зелёный, то есть на нашем сочетании
# версий путь проверки исключение уважает — но полагаться на это как на правило не следует.
#
# 2026-08-13, `0.18.0`: вторая запись появилась тем же способом и по тому же поводу — контракт
# выпущен нашей же цепочкой минутами раньше, а репин движка есть следующее звено того же шага. И
# предупреждение выше ПОДТВЕРДИЛОСЬ: локальная проверка лок-файла исключение не уважает
# (`ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION` на любом `pnpm <script>`), тогда как прямые вызовы
# (`tsc`, `vitest`, гейты) и CI проходят. Судим по ним; окно НЕ выключается — точечное исключение
# для своего пакета и глухая политика для всех остальных остаются в силе.
minimumReleaseAgeExclude:
  - '@trdlabs/sdk@0.15.0'
  - '@trdlabs/sdk@0.18.0'
