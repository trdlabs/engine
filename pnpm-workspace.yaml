strictDepBuilds: false
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: set this to true or false
# Окно созревания (pnpm 11 включает его по умолчанию) отказывает в установке версии,
# опубликованной только что. Исключение ниже ТОЧЕЧНОЕ и ВРЕМЕННОЕ: `@trdlabs/sdk@0.16.0` —
# наш собственный пакет, выпущенный нашим же release workflow и проверенный независимо из
# реестра: версия, точный пин контракта, provenance `slsa.dev/provenance/v1`, gitHead 60d6d09.
# Снимается, когда версия перерастёт окно. Все остальные записи лок-файла выдержку проходят
# как обычно.
minimumReleaseAgeExclude:
  - '@trdlabs/sdk@0.16.0'
