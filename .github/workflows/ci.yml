name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The three gates the initiative card names for Ф2, plus a typecheck. They are separate jobs on
  # purpose: a red determinism gate and a red golden tape mean different things, and a combined job
  # would hide which one fired.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  determinism-gate:
    # Static half of the determinism guarantee (SSOT «Инварианты ядра» §2): no wall clock, no
    # randomness, no host entropy, no unsorted iteration anywhere in src/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/determinism-gate.mjs

  golden-tapes:
    # Dynamic half: tape integrity (FROZEN status, provenance, content-ref drift) and byte-identity
    # of two independent runs over every committed tape × bundle pair, compared against the binding
    # expectations. Tapes are frozen as of 2026-07-25 — see docs/run-identity.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate:tapes
      - run: pnpm exec vitest run test/golden-tape.test.ts
      - name: expectations refuse a refresh without --force
        # Guard of the guard: the anchor is only binding while it cannot be regenerated by accident.
        run: |
          if pnpm gate:refresh > /dev/null 2>&1; then
            echo "::error::refresh-expectations succeeded without --force — the frozen anchor is not protected"
            exit 1
          fi
          echo "refresh guard holds: expectations cannot be regenerated without --force"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
