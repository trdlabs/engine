# Manual engine release — triggered via workflow_dispatch only.
#
# Ported from `@trdlabs/backtester-sdk`'s release workflow, per the initiative's «Environment /
# operations prerequisites»: OIDC provenance + `assert-version-publishable` + a fail-closed
# preflight. The npm registry is immutable per version, so PUBLISHING IS THE RELEASE; the git tag
# created afterwards is a release note, not a delivery channel.
#
# What this workflow deliberately does NOT do: bump `ENGINE_VERSION`. That constant is the
# execution-SEMANTICS generation and rides inside every canonical trace — a release must not
# restamp run identity (owner decision 2026-07-26). See `src/core/simulate.ts` and
# `docs/run-identity.md`.
#
# Authentication: the `NPM_TOKEN` repository secret (an npm automation token scoped to publish
# `@trdlabs/engine`), consumed as `NODE_AUTH_TOKEN`. Provenance comes from GitHub OIDC
# (`id-token: write`). Once a trusted publisher is configured for the package on npmjs.com, the
# `NODE_AUTH_TOKEN` env can be dropped in favour of pure OIDC.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish to npm (must equal package.json version, e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write # secondary git tag + release note only
  id-token: write # npm provenance attestation (Sigstore via GitHub OIDC)

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ── Fail-closed preflight ───────────────────────────────────────────────
      # Every check below must be able to STOP the release. A release that publishes anyway on a
      # failed check is not a gate, it is a log line.

      - name: Validate version format (semver only)
        # Block scalar on purpose: a plain YAML scalar ends at the first ": ", so an inline script
        # containing a colon silently breaks the whole file's parse — which is exactly how this
        # workflow shipped without a usable `workflow_dispatch` trigger the first time.
        run: |
          node -e '
            const v = process.env.VERSION ?? "";
            if (!/^\d+\.\d+\.\d+$/.test(v)) {
              console.error(`not a semver release, got "${v}"`);
              process.exit(1);
            }
          '

      - name: Assert the dispatched version equals package.json
        # The dispatch input is a human typing a number. package.json is what actually ships.
        # Publishing when they disagree would tag one version and ship another.
        run: |
          node -e '
            const pkg = require("./package.json");
            if (pkg.version !== process.env.VERSION) {
              console.error(`dispatched ${process.env.VERSION} but package.json says ${pkg.version} — bump and merge first`);
              process.exit(1);
            }
          '

      - name: Release preflight (public, semver, licence, provenance, registry)
        # `--release` is the strict half: the version must be FREE and must move `latest` forward.
        #
        # The «refuse to publish an existing version» step that stood here as inline `npm view` is
        # gone — not because the check was wrong, but because it lived only in this YAML. The
        # script, which is what anyone runs locally and what CI runs on every PR, never asked the
        # registry at all and cheerfully printed «0.3.0 is publishable» while 0.3.0 was published
        # and immutable. Two implementations of one rule always drift toward the weaker one; this
        # is now a single implementation with two modes.
        run: pnpm release:preflight --release

      # ── The gates that make the artifact trustworthy ────────────────────────
      # The whole value of this package is that it is deterministic and anchored. Publishing a
      # build that has not re-proven both would ship the claim without the evidence.

      - name: Typecheck
        run: pnpm typecheck
      - name: Determinism gate
        run: pnpm gate:determinism
      - name: Tape integrity (FROZEN anchor)
        run: pnpm gate:tapes
      - name: Full suite
        run: pnpm test
      - name: Build dist
        run: pnpm build

      - name: Clean-consumer gate (the tarball, not the repo)
        # The suite imports `src/`; consumers get the TARBALL. They drift whenever `files`,
        # `exports` or the build output move — a package can be fully green in-repo and still
        # install into a broken import. Proven here BEFORE publish, because npm is immutable.
        run: pnpm verify:package

      - name: Publish to npm (with provenance)
        # `npm publish`, not `pnpm publish`: pnpm attempts its own OIDC token exchange first, and
        # when that 404s (no trusted publisher configured) it falls back to the token and silently
        # SKIPS provenance — which is exactly how 0.1.0 shipped unattested while this step printed
        # success. The npm CLI generates the Sigstore attestation directly from the Actions OIDC
        # identity granted by `id-token: write`.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify the published version actually carries provenance
        # A step named «with provenance» that nobody checks is a claim, not a fact — the previous
        # release proved it. The registry is the only authority on what was attached, so ask it.
        # Registry reads for a fresh publish can lag, hence the bounded retry rather than one shot.
        run: |
          for attempt in $(seq 1 20); do
            body=$(curl -sf "https://registry.npmjs.org/-/npm/v1/attestations/@trdlabs/engine@${VERSION}" || true)
            if echo "$body" | grep -q 'slsa.dev/provenance'; then
              echo "provenance attestation present for ${VERSION}"
              exit 0
            fi
            sleep 15
          done
          echo "PUBLISHED WITHOUT PROVENANCE: no attestation for @trdlabs/engine@${VERSION}"
          echo "npm is immutable, so this version cannot be fixed in place — cut the next patch."
          exit 1

      - name: Verify the PUBLISHED artifact from the registry
        # `verify:package` proves this TREE packages correctly; it says nothing about what the
        # registry now serves. The gap between those two claims already cost a slice: published
        # 0.3.0 pinned @trdlabs/sdk@0.13.0 and carried no actor surface while main under the same
        # number pinned 0.14.0 and did. Every in-repo gate was green — none of them could see it.
        #
        # This step installs what a consumer installs and asks four questions: version present,
        # contract pinned exactly, actor surface callable from the tarball, and exactly ONE copy of
        # the contract in the consumer tree (the branded µs types are nominal — two copies are two
        # different types, and that surfaces in the consumer's build, not here).
        run: pnpm verify:published --version "${VERSION}"

      - name: Tag the release (secondary release note)
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create the GitHub release note
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            --title "@trdlabs/engine v${VERSION}" \
            --notes "Published to npm with provenance. The canonical delivery channel is the npm registry; this release carries no tarball."
